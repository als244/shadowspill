[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "example-training-definitions"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["shadowspill[training]", "shadowspill-client"]

[project.entry-points."shadowspill.definitions"]
training = "example_training:register"

[tool.hatch.build.targets.wheel]
packages = ["src/example_training"]
