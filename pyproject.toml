[build-system]
requires = ["scikit-build-core>=0.11,<0.12"]
build-backend = "scikit_build_core.build"

[project]
name = "shadowspill"
version = "0.1.0.dev0"
description = "Transparent memory offload, prefetch, and recomputation planning"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
pytorch = ["torch>=2.13,<2.14"]
dev = [
  "hypothesis>=6.130",
  "mypy>=1.15",
  "numpy>=2.0",
  "pytest>=8",
  "pytest-cov>=6",
  "ruff>=0.11",
]

[tool.scikit-build]
cmake.version = ">=3.25"
cmake.build-type = "RelWithDebInfo"
wheel.packages = ["src/shadowspill"]
build-dir = "build/{wheel_tag}"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not fresh_process'"
pythonpath = ["src", "."]
markers = [
  "cuda: requires the qualified CUDA backend and accelerator",
  "qualification: long-running numerical or performance gate",
  "fresh_process: needs a process where no test has touched the device yet; run one per process, which CTest does",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["shadowspill"]

# The external operation library ships no annotations.
[[tool.mypy.overrides]]
module = "mlops.*"
ignore_missing_imports = true

# A workload is model code sitting on two untyped surfaces: torch types
# Module.__call__ as returning Any, and the operation library above returns
# Any throughout. Every forward would need a cast that asserts nothing, so
# the Any-return check is off here. The gate itself covers `shadowspill`.
[[tool.mypy.overrides]]
module = "workloads.*"
warn_return_any = false

[tool.coverage.run]
branch = true
source = ["shadowspill"]

[tool.coverage.report]
show_missing = true
fail_under = 90
