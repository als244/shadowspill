[tool.pytest.ini_options]
testpaths = ["packages/client/tests", "packages/engine/tests", "packages/workloads/tests", "tests"]
addopts = "-q -m 'not fresh_process and not slow'"
pythonpath = ["packages/client/src", "packages/client/tests", "packages/engine/src", "packages/workloads/src", "packages/engine/tests", "packages/workloads/tests", "."]
markers = [
  "cuda: requires the qualified CUDA backend and accelerator",
  "network: requires a reachable memory daemon named by SHADOWSPILL_NETWORK_PEER",
  "qualification: long-running numerical or performance gate",
  "fresh_process: runs once, under CTest, in a process of its own; the shared pytest process deselects it",
  "slow: an end-to-end recipe or quickstart run of minutes; deselected by default, selected with -m slow",
]

[tool.ruff]
src = ["packages/client/src", "packages/client/tests", "packages/engine/src", "packages/workloads/src", "packages/engine/tests", "packages/workloads/tests", "."]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["shadowspill", "shadowspill_client"]

# The external operation library ships no annotations.
[[tool.mypy.overrides]]
module = "mlops.*"
ignore_missing_imports = true

# A workload is model code sitting on two untyped surfaces: torch types
# Module.__call__ as returning Any, and the operation library above returns
# Any throughout. Every forward would need a cast that asserts nothing, so
# the Any-return check is off here. The gate itself covers `shadowspill`.
[[tool.mypy.overrides]]
module = "shadowspill_workloads.*"
warn_return_any = false

[tool.coverage.run]
branch = true
source = ["shadowspill"]

[tool.coverage.report]
show_missing = true
fail_under = 90
