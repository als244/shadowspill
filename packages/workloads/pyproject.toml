[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "shadowspill-workloads"
version = "0.1.0.dev0"
description = "Optional model integrations and training recipes for ShadowSpill"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["shadowspill==0.1.0.dev0"]

[project.optional-dependencies]
training = [
  "shadowspill[pytorch,training]==0.1.0.dev0",
  "huggingface-hub>=1.0",
  "pyarrow>=18",
  "transformers>=5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/shadowspill_workloads"]
