[build-system]
requires = ["scikit-build-core>=0.11,<0.12"]
build-backend = "scikit_build_core.build"

[project]
name = "shadowspill"
version = "0.1.0.dev0"
description = "Transparent memory evict, fetch, and recomputation planning"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "blake3>=1.0,<2",
  "matplotlib>=3.9",
  "numpy>=2.0",
  "shadowspill-client==0.1.0.dev0",
]

[project.optional-dependencies]
pytorch = ["torch>=2.13,<2.14", "nvidia-ml-py>=13.580,<14"]
training = ["wandb>=0.20"]
dev = [
  "cmake>=3.25",
  "hypothesis>=6.130",
  "mypy>=1.15",
  "numpy>=2.0",
  "pytest>=8",
  "pytest-cov>=6",
  "ruff>=0.11",
]

[tool.scikit-build]
cmake.version = ">=3.25"
cmake.build-type = "RelWithDebInfo"
wheel.packages = ["src/shadowspill"]
build-dir = "build/{wheel_tag}"
