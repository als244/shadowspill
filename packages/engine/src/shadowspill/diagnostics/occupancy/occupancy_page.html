<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Occupancy __TITLE__</title>
<style>
  :root { --bg: #ffffff; --ink: #1d1d1f; --muted: #6e6e73; --line: #d2d2d7; --panel: #fbfbfd; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #161618; --ink: #f1f1f3; --muted: #a1a1a6; --line: #3a3a3f; --panel: #1f1f22; }
  }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--ink); font: 14px/1.4 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin-bottom: 12px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 12px 6px; margin-bottom: 14px; }
  .head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 6px; }
  .head h2 { font-size: 16px; margin: 0; }
  .head .meta { color: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  .controls { margin-left: auto; display: flex; gap: 6px; align-items: center; font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
  button { background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 2px 10px; cursor: pointer; font: inherit; }
  select { background: var(--bg); color: var(--ink); padding: 6px; max-width: 100%; }
  a { color: #547fe8; } .scroll { overflow-x: auto; } details { margin: 10px 0; }
  summary { cursor: pointer; } pre { white-space: pre-wrap; overflow-wrap: anywhere; }
  canvas { display: block; width: 100%; touch-action: none; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-family: ui-monospace, Menlo, monospace; font-size: 12px; padding: 6px 4px 4px; }
  .legend span::before { content: ""; display: inline-block; width: 11px; height: 11px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; background: var(--c); }
  .legend .rule::before { width: 14px; height: 0; border-top: 2px dashed var(--c); border-radius: 0; vertical-align: 3px; background: none; }
  .legend .head { color: var(--muted); }
  .legend .head::before { display: none; }
  .legend .gap { flex-basis: 100%; height: 0; }
  .legend .gap::before { display: none; }
  .cards { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 8px; }
  .card { border: 1px solid var(--line); border-left: 4px solid #4f6fd8; border-radius: 8px; padding: 6px 12px; min-width: 120px; background: var(--bg); }
  .card .k { color: var(--muted); font-size: 12px; }
  .card .v { font: 600 18px/1.3 ui-monospace, SFMono-Regular, Menlo, monospace; }
  table { width: 100%; border-collapse: collapse; font: 12px ui-monospace, Menlo, monospace; }
  th, td { padding: 5px 10px; border-bottom: 1px solid var(--line); text-align: right; }
  th:first-child, td:first-child { text-align: left; }
  .tabs { display: flex; gap: 6px; margin: 0 0 12px; }
  .tabs button { padding: 5px 16px; font-weight: 600; }
  .tabs button[aria-pressed="true"] { background: #4f6fd8; border-color: #4f6fd8; color: #fff; }
  .note { color: var(--muted); margin: 4px 0 10px; }
  .stage h3 { font-size: 15px; margin: 0 0 2px; }
  .stage .where { color: var(--muted); font: 12px ui-monospace, Menlo, monospace; margin-bottom: 8px; }
  .pair { display: grid; grid-template-columns: repeat(auto-fit, minmax(460px, 1fr)); gap: 10px; margin-bottom: 8px; }
  .option { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px 4px; background: var(--bg); opacity: 0.72; }
  .option.chosen { border: 2px solid var(--c); opacity: 1; }
  .option h4 { font-size: 14px; margin: 0 0 4px; display: flex; gap: 8px; align-items: baseline; }
  .option h4::before { content: ""; width: 11px; height: 11px; border-radius: 2px; background: var(--c); align-self: center; }
  .tag { font: 12px ui-monospace, Menlo, monospace; color: var(--muted); font-weight: 400; }
  .option.chosen .tag { color: var(--ink); font-weight: 600; }
  .option tr.sum td { border-bottom: none; font-weight: 600; }
  .option .kept { color: var(--muted); font: 12px ui-monospace, Menlo, monospace; padding: 2px 10px 6px; }
  .map table { width: auto; }
  .map td, .map th { text-align: center; padding: 3px 8px; }
  .map td:first-child, .map th:first-child, .map td:last-child, .map th:last-child { text-align: left; }
  .map a { display: inline-block; width: 26px; height: 14px; border-radius: 3px; background: var(--c); vertical-align: middle; }
  .map .none { display: inline-block; width: 26px; color: var(--muted); }
  #tip { position: fixed; pointer-events: none; background: var(--ink); color: var(--bg); padding: 6px 8px; border-radius: 6px; font: 12px/1.35 ui-monospace, Menlo, monospace; white-space: pre; display: none; z-index: 5; max-width: 60vw; }
</style>
</head>
<body>
<h1>Occupancy over the step: __TITLE__</h1>
<div id="prepared"></div>
<div class="sub" id="plan"></div>
<div class="sub" id="sub"></div>
<div id="tabs"></div>
<div id="panels"></div>
<div id="tasks" hidden></div>
<div id="tip"></div>
<script id="data" type="application/json">__OCCUPANCY_DATA__</script>
<script>
(function () {
  const DOCUMENT = JSON.parse(document.getElementById("data").textContent);
  const requested = /^#view-(\d+)(-tasks)?$/.exec(location.hash);
  let tab = requested && requested[2] ? "tasks" : "timeline";
  const selected = requested && DOCUMENT.views && +requested[1] < DOCUMENT.views.length ? +requested[1] : 0;
  const DATA = DOCUMENT.views ? DOCUMENT.views[selected].data : DOCUMENT;
  // Two families told apart by tone: objects (pools, and transfer bars) in
  // light and mid blues, purples, pinks, teals and greens; task phases
  // (compute bars) dark -- navy, maroon and grey for the step's own work,
  // green, blue and purple for a distributed step's gradient padding,
  // gradient communication and weight communication -- with the
  // regenerating part in yellow.
  const PALETTE = {
    "weights": "#5c6bc0", "optimizer state": "#b39ddb", "model gradients": "#ec407a", "tangents": "#f8bbd0",
    "saved activations": "#26a69a", "recomputed activations": "#80cbc4", "inputs": "#9ccc65", "buffers": "#dce775",
    "control": "#90a4ae", "outputs": "#ffa726", "other": "#aa00ff", "task workspace": "#fff59d", "unattributed": "#bdbdbd",
    "forward": "#0a3165", "backward": "#69001e", "optimizer": "#616161", "recompute": "#ffd600",
    "gradient_local": "#005f00", "gradient_communication": "#0000d2", "weight_communication": "#780096",
    "parameter": "#5c6bc0", "optimizer_state": "#b39ddb", "gradient": "#ec407a", "activation": "#26a69a",
    "input": "#9ccc65", "buffer": "#dce775", "output": "#ffa726",
    "host to device copy": "#228be6", "device to host copy": "#00a2a8",
    "all-gather": "#7950f2", "reduce-scatter": "#e8590c", "all-reduce": "#d6336c",
    "copy / dispatch / wait (unsplit)": "#adb5bd", "dispatch / wait / other work": "#74808b",
  };
  const FALLBACK = ["#f06292", "#ba68c8", "#4dd0e1", "#aed581", "#ffb74d", "#a1887f"];
  let fallbackIndex = 0;
  const color = (name) => PALETTE[name] || (PALETTE[name] = FALLBACK[fallbackIndex++ % FALLBACK.length]);
  const fmtGiB = (v) => v >= 100 ? v.toFixed(0) + " GiB" : v >= 10 ? v.toFixed(1) + " GiB" : v.toFixed(2) + " GiB";
  const fmtBytes = (b) => b >= 2 ** 30 ? (b / 2 ** 30).toFixed(2) + " GiB" : b >= 2 ** 20 ? (b / 2 ** 20).toFixed(1) + " MiB" : b >= 1024 ? (b / 1024).toFixed(0) + " KiB" : b + " B";
  const fmtS = (s) => s >= 10 ? s.toFixed(2) + " s" : s.toFixed(3) + " s";

  const fmtDuration = (s) => s < 0.001 ? (s * 1e6).toFixed(2) + " µs" : (s * 1e3).toFixed(3) + " ms";
  const preciseBytes = (b) => b == null ? "unavailable" : fmtBytes(b) + " (" + b.toLocaleString() + " bytes)";

  if (DOCUMENT.views) {
    const root = document.getElementById("prepared");
    root.className = "panel";
    function element(tag, text, parent = root) {
      const node = document.createElement(tag); node.textContent = text; parent.appendChild(node); return node;
    }
    function table(title, headers, rows) {
      element("h2", title);
      const scroll = element("div", ""); scroll.className = "scroll";
      const table = element("table", "", scroll), head = element("tr", "", table);
      headers.forEach(name => element("th", name, head));
      rows.forEach(cells => {
        const row = element("tr", "", table);
        cells.forEach(value => {
          const cell = element("td", "", row);
          if (typeof value === "function") value(cell); else cell.textContent = value;
        });
      });
    }
    function openView(index) {
      if (index === selected) return;
      location.hash = "view-" + index + (tab === "tasks" ? "-tasks" : ""); location.reload();
    }
    const runtime = DOCUMENT.kind === "runtime_trace";
    element("h2", runtime ? "Measured runtime and predicted Plan" : "Prepared builds and Plans");
    element("p", runtime
      ? "Measured execution and transfer timings come from this invocation's device trace. Switch to the saved Plan to compare predicted timings. Memory occupancy is reconstructed from the Plan's object lifetimes on the traced clock; interpolated lease times and missing timings are labeled. These timelines exclude client upload and report generation."
      : "Estimated times come from measured task profiles and schedule simulation. They are not measured end-to-end request latency. Every retained worker Plan is available below, including accumulation paths.");
    const choice = element("select", ""); choice.setAttribute("aria-label", "Worker Plan report");
    DOCUMENT.views.forEach((view, index) => {
      const option = element("option", "Rank " + view.rank + " · " + view.mode + " · " + view.id.slice(0, 12) + " · " + fmtDuration(view.data.end_seconds), choice);
      option.value = index; option.selected = index === selected;
    });
    choice.addEventListener("change", () => openView(+choice.value));
    const rows = DOCUMENT.rows || [];
    if (!runtime) table("Prepared candidates", ["Operation", "Batch", "Build", "Microbatches", "Estimated step / call", "Reports"],
      rows.filter(row => row.kind === "candidate").map(({values: v}) => [
        v.operation.operation + "/" + (v.operation.outputs || "none") + " (" + v.operation.mode + ")",
        v.batch, v.case, v.count, fmtDuration(v.simulated_seconds), cell => {
          const keys = new Set(v.workers.flatMap(w => [w.main, w.masked, w.optimizer].filter(Boolean).map(id => w.rank + ":" + id)));
          DOCUMENT.views.forEach((view, index) => {
            if (!keys.has(view.rank + ":" + view.id)) return;
            const link = element("a", "rank " + view.rank + " " + view.mode + " " + view.id.slice(0, 8), cell);
            link.href = "#view-" + index;
            link.addEventListener("click", event => { event.preventDefault(); openView(index); });
            cell.appendChild(document.createElement("br"));
          });
        }
      ]));
    if (!runtime) table("Build configurations", ["Build", "Settings"], rows.filter(row => row.kind === "build_case").map(({values: v}) => [v.index, JSON.stringify(v)]));
    const rejected = rows.filter(row => row.kind === "rejected_candidate");
    if (rejected.length) table("Rejected candidates", ["Operation", "Build", "Stage", "Reason"], rejected.map(({values: v}) => [v.operation.operation, v.case, v.stage, v.reason]));
    const details = element("details", "");
    element("summary", runtime ? "Invocation and saved Plan identity" : "Configuration, coverage and memory metadata", details);
    element("pre", JSON.stringify(rows.filter(row => !["candidate", "worker_plan", "build_case", "rejected_candidate"].includes(row.kind)), null, 2), details);
  }

  if (DATA.allocation) {
    const a = DATA.allocation, note = document.createElement("p");
    note.className = "sub";
    note.textContent = "GPU allowance: " + preciseBytes(a.effective_execution_bytes)
      + " · fixed runtime and reserved memory outside the execution pool: " + preciseBytes(a.fixed_device_bytes)
      + (DATA.simulation_only_reasons.length ? " · Simulation only: " + DATA.simulation_only_reasons.join("; ") : "");
    document.getElementById("prepared").after(note);
  }

  document.getElementById("plan").textContent = DATA.plan || "";
  document.getElementById("sub").textContent = DATA.clock + " · step of " + fmtS(DATA.end_seconds)
    + (DATA.summary && DATA.summary.assumed_fetch_solo_gbps != null
      ? " · planned host-copy solo/concurrent: fetch " + DATA.summary.assumed_fetch_solo_gbps.toFixed(1)
        + "/" + DATA.summary.assumed_fetch_concurrent_gbps.toFixed(1) + " GB/s, evict "
        + DATA.summary.assumed_evict_solo_gbps.toFixed(1) + "/"
        + DATA.summary.assumed_evict_concurrent_gbps.toFixed(1) + " GB/s" : "")
    + (DATA.untimed_transfers ? " · " + DATA.untimed_transfers + " transfers the trace could not time, off the lanes" : "")
    + " · drag across a span to zoom to it, shift-drag to pan, scroll to zoom, fit resets, one zoom for every panel · dashed red: capacity, dotted amber: peak";

  // One viewport, shared by every panel.
  const view = { t0: 0, t1: DATA.end_seconds };
  const panels = [];
  const tip = document.getElementById("tip");
  const LEFT = 64, RIGHT = 12, TOP = 8, BOTTOM = 22;

  function makePanel(title, meta, height) {
    const root = document.createElement("div"); root.className = "panel";
    const head = document.createElement("div"); head.className = "head";
    const h2 = document.createElement("h2"); h2.textContent = title;
    const m = document.createElement("span"); m.className = "meta"; m.textContent = meta;
    const controls = document.createElement("div"); controls.className = "controls";
    const minus = document.createElement("button"); minus.textContent = "−";
    const zoom = document.createElement("span"); zoom.textContent = "1.00×";
    const plus = document.createElement("button"); plus.textContent = "+";
    const fit = document.createElement("button"); fit.textContent = "fit";
    controls.append(minus, zoom, plus, fit);
    head.append(h2, m, controls); root.append(head);
    const canvas = document.createElement("canvas"); canvas.height = height; root.append(canvas);
    const legend = document.createElement("div"); legend.className = "legend"; root.append(legend);
    document.getElementById("panels").append(root);
    const panel = { root, canvas, legend, zoomLabel: zoom, height };
    minus.onclick = () => zoomBy(0.5, (view.t0 + view.t1) / 2);
    plus.onclick = () => zoomBy(2, (view.t0 + view.t1) / 2);
    fit.onclick = () => { view.t0 = 0; view.t1 = DATA.end_seconds; redraw(); };
    attachInteraction(panel);
    panels.push(panel);
    return panel;
  }

  function zoomBy(factor, center) {
    const span = (view.t1 - view.t0) / factor;
    const minSpan = DATA.end_seconds / 4000, maxSpan = DATA.end_seconds;
    const clamped = Math.min(maxSpan, Math.max(minSpan, span));
    const frac = (center - view.t0) / (view.t1 - view.t0);
    view.t0 = Math.max(0, center - frac * clamped);
    view.t1 = Math.min(DATA.end_seconds, view.t0 + clamped);
    view.t0 = Math.max(0, view.t1 - clamped);
    redraw();
  }

  function attachInteraction(panel) {
    const c = panel.canvas;
    let dragging = null;
    c.addEventListener("wheel", (e) => {
      e.preventDefault();
      const rect = c.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const t = xToT(panel, x);
      zoomBy(e.deltaY < 0 ? 1.25 : 0.8, t);
    }, { passive: false });
    c.addEventListener("pointerdown", (e) => {
      const rect = c.getBoundingClientRect();
      dragging = { x: e.clientX, startX: e.clientX - rect.left, t0: view.t0, t1: view.t1, pan: e.shiftKey || e.button === 1 };
      c.setPointerCapture(e.pointerId);
    });
    c.addEventListener("pointerup", (e) => {
      if (!dragging) return;
      const rect = c.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const a = Math.min(dragging.startX, x), b = Math.max(dragging.startX, x);
      const chose = !dragging.pan && b - a > 4;
      dragging = null; panel.selection = null;
      if (chose) {
        const t0 = Math.max(0, xToT(panel, a)), t1 = Math.min(DATA.end_seconds, xToT(panel, b));
        if (t1 - t0 >= DATA.end_seconds / 4000) { view.t0 = t0; view.t1 = t1; }
      }
      redraw();
    });
    c.addEventListener("pointermove", (e) => {
      const rect = c.getBoundingClientRect();
      const x = e.clientX - rect.left, y = e.clientY - rect.top;
      if (dragging && dragging.pan) {
        const dt = (dragging.x - e.clientX) / plotWidth(panel) * (dragging.t1 - dragging.t0);
        const span = dragging.t1 - dragging.t0;
        view.t0 = Math.min(Math.max(0, dragging.t0 + dt), DATA.end_seconds - span);
        view.t1 = view.t0 + span;
        redraw();
      } else if (dragging) {
        panel.selection = [Math.max(LEFT, Math.min(dragging.startX, x)), Math.min(c.clientWidth - RIGHT, Math.max(dragging.startX, x))];
        panel.draw(prepare(panel));
        drawSelection(panel);
      }
      const text = panel.hover ? panel.hover(x, y) : null;
      if (text) { tip.style.display = "block"; tip.textContent = text; tip.style.left = (e.clientX + 14) + "px"; tip.style.top = (e.clientY + 14) + "px"; }
      else tip.style.display = "none";
    });
    c.addEventListener("pointerleave", () => { tip.style.display = "none"; });
  }

  const plotWidth = (panel) => panel.canvas.clientWidth - LEFT - RIGHT;
  const tToX = (panel, t) => LEFT + (t - view.t0) / (view.t1 - view.t0) * plotWidth(panel);
  const xToT = (panel, x) => view.t0 + (x - LEFT) / plotWidth(panel) * (view.t1 - view.t0);

  function prepare(panel) {
    const dpr = window.devicePixelRatio || 1;
    const w = panel.canvas.clientWidth;
    panel.canvas.width = Math.round(w * dpr); panel.canvas.height = Math.round(panel.height * dpr);
    const ctx = panel.canvas.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, panel.height);
    ctx.font = "11px ui-monospace, Menlo, monospace";
    panel.zoomLabel.textContent = (DATA.end_seconds / (view.t1 - view.t0)).toFixed(2) + "×";
    return ctx;
  }

  function timeAxis(ctx, panel) {
    const y = panel.height - BOTTOM;
    ctx.strokeStyle = getComputedStyle(document.body).getPropertyValue("--line");
    ctx.fillStyle = getComputedStyle(document.body).getPropertyValue("--muted");
    ctx.beginPath(); ctx.moveTo(LEFT, y + 0.5); ctx.lineTo(panel.canvas.clientWidth - RIGHT, y + 0.5); ctx.stroke();
    const span = view.t1 - view.t0;
    const step = [0.001, 0.002, 0.005, 0.01, 0.02, 0.05, 0.1, 0.2, 0.5, 1, 2, 5, 10, 20].find((s) => span / s <= 12) || 50;
    for (let t = Math.ceil(view.t0 / step) * step; t <= view.t1 + 1e-9; t += step) {
      const x = tToX(panel, t);
      ctx.beginPath(); ctx.moveTo(x + 0.5, y); ctx.lineTo(x + 0.5, y + 4); ctx.stroke();
      ctx.textAlign = "center"; ctx.fillText((step < 1 ? t.toFixed(step < 0.01 ? 3 : 2) : t.toFixed(0)) + "s", x, y + 15);
    }
  }

  // --- the summary cards ---------------------------------------------------------------
  if (DATA.summary) {
    const S = DATA.summary;
    const rate = (achieved, assumed) =>
      (achieved == null ? "n/a" : achieved.toFixed(1)) + " / "
      + (assumed == null ? "n/a" : assumed.toFixed(1)) + " GB/s";
    const cards = [
      ["overall time", fmtS(S.seconds)],
      ["tokens/s", S.tokens_per_second == null ? "n/a" : Math.round(S.tokens_per_second).toLocaleString()],
      ["peak spill memory", fmtGiB(S.spill_peak_gib)],
      ["peak execution memory", S.execution_peak_gib == null ? "n/a" : fmtGiB(S.execution_peak_gib)],
      ["idle", S.idle_percent.toFixed(1) + "%"],
      ["recompute overhead (profile estimate)", S.recompute_percent == null ? "n/a" : S.recompute_percent.toFixed(1) + "%"],
      ["fetch lane util", S.fetch_utilization_percent.toFixed(1) + "%"],
      ["evict lane util", S.evict_utilization_percent.toFixed(1) + "%"],
      ["full objects fetched", fmtGiB(S.fetch_gib)],
      ["full objects evicted", fmtGiB(S.evict_gib)],
      ["host bytes fetched", fmtGiB(S.fetch_host_gib ?? S.fetch_gib)],
      ["host bytes evicted", fmtGiB(S.evict_host_gib ?? S.evict_gib)],
      ["effective fetch / planned blend", rate(S.fetch_gbps, S.assumed_fetch_gbps)],
      ["effective evict / planned blend", rate(S.evict_gbps, S.assumed_evict_gbps)],
    ];
    const root = document.createElement("div"); root.className = "panel";
    const h2 = document.createElement("h2"); h2.textContent = "Summary"; h2.style.fontSize = "16px"; h2.style.margin = "0 0 8px"; root.append(h2);
    const row = document.createElement("div"); row.className = "cards";
    cards.forEach(([k, v]) => { const c = document.createElement("div"); c.className = "card"; const kk = document.createElement("div"); kk.className = "k"; kk.textContent = k; const vv = document.createElement("div"); vv.className = "v"; vv.textContent = v; c.append(kk, vv); row.append(c); });
    root.append(row);
    const explanation = document.createElement("p"); explanation.className = "meta";
    explanation.textContent = "Lane utilization is busy time / step time. Effective rates count full execution-object bytes / complete transfer time, including any collective phases and waits. Host-copy bytes are listed separately. These rates are not PCIe or NVLink bandwidth. The planned blend uses simulated transfer intervals; trace rates use measured intervals and omit untimed transfers. Recompute overhead compares isolated pair profiles; it is not a directly timed kernel interval."
      + (S.recompute_percent == null ? " Recompute overhead is unavailable because a selected pair lacks its save or recompute profile." : "");
    root.append(explanation); document.getElementById("panels").prepend(root);
  }

  // --- the lanes: fetch, compute, evict -------------------------------------------
  // A step without collectives has nothing to split inside a transfer: its
  // lanes are drawn by object, like the plan's, and the accounting is omitted.
  // Transfers whose copy could not be separated always keep that breakdown.
  const collectiveRecords = (DATA.collectives && DATA.collectives.enabled && DATA.collectives.records) || [];
  const unsplitTransfers = DATA.transfer_phases
    ? DATA.transfer_phases.unresolved_copy_transfers.fetch + DATA.transfer_phases.unresolved_copy_transfers.evict + DATA.transfer_phases.unmatched_records
    : 0;
  const showPhases = Boolean(DATA.transfer_phases) && (collectiveRecords.length > 0 || unsplitTransfers > 0);
  if (DATA.compute) {
    const phaseItems = (direction) => showPhases
      ? DATA.transfer_phases[direction].map((p) => [p.start_ns / 1e9, p.end_ns / 1e9, p.execution_bytes, p.label, p.alias_group_id, p.host_bytes, p])
      : DATA[direction];
    const fetchItems = phaseItems("fetch"), evictItems = phaseItems("evict");
    const lanes = [["fetch", "fetch", fetchItems], ["compute", "compute", DATA.compute], ["evict", "evict", evictItems]];
    const meta = DATA.fetch.length + " fetches · " + DATA.compute.length + " tasks · " + DATA.evict.length + " evictions";
    const panel = makePanel("fetch, compute and evict lanes", meta, 3 * 62 + BOTTOM + TOP);
    const objectNames = new Set();
    fetchItems.concat(evictItems).forEach((s) => objectNames.add(s[3]));
    const group = (title, names, suffix) => {
      const head = document.createElement("span"); head.className = "head"; head.textContent = title; panel.legend.append(head);
      names.forEach((n) => { const s = document.createElement("span"); s.style.setProperty("--c", color(n)); s.textContent = n + suffix; panel.legend.append(s); });
      const gap = document.createElement("span"); gap.className = "gap"; panel.legend.append(gap);
    };
    group(showPhases ? "fetch and evict bars, by operation:" : "fetch and evict bars, by object:", Array.from(objectNames), "");
    // a distributed step's communication phases join the legend when it has them
    const communication = ["gradient_local", "gradient_communication", "weight_communication"]
      .filter((phase) => DATA.compute.some((task) => task[2] === phase));
    group("compute bars, by the task's phase:", ["forward", "backward", "optimizer", ...communication], " tasks");
    const rc = document.createElement("span"); rc.style.setProperty("--c", color("recompute")); rc.textContent = "recompute shading: estimated extra pair time from profiles, drawn at backward start; not a measured boundary"; panel.legend.append(rc);
    const LANE_H = 62, BAR = 44;
    panel.draw = (ctx) => {
      const W = panel.canvas.clientWidth;
      const width = Math.max(1, Math.floor(plotWidth(panel)));
      const span = view.t1 - view.t0;
      lanes.forEach(([kind, label, items], row) => {
        const y = TOP + row * LANE_H + (LANE_H - BAR) / 2;
        ctx.textAlign = "right"; ctx.fillStyle = getComputedStyle(document.body).getPropertyValue("--muted"); ctx.fillText(label, LEFT - 8, y + BAR / 2 + 4);
        ctx.strokeStyle = getComputedStyle(document.body).getPropertyValue("--line");
        ctx.beginPath(); ctx.moveTo(LEFT, y + BAR + 0.5); ctx.lineTo(W - RIGHT, y + BAR + 0.5); ctx.stroke();
        // Rasterise the lane by pixel column: a column is filled when any bar
        // covers part of it and takes the colour of the category covering
        // most of it, so a burst of transfers far narrower than a pixel is a
        // visible block rather than a single hairline.
        const tally = new Array(width);
        const paint = (s, e, c) => {
          if (e < view.t0 || s > view.t1 || e <= s) return;
          const x0 = (Math.max(s, view.t0) - view.t0) / span * width;
          const x1 = Math.max((Math.min(e, view.t1) - view.t0) / span * width, x0 + 1e-6);
          const c0 = Math.max(0, Math.floor(x0)), c1 = Math.min(width - 1, Math.floor(x1));
          for (let col = c0; col <= c1; col++) {
            const part = Math.min(x1, col + 1) - Math.max(x0, col);
            if (part <= 0) continue;
            let m = tally[col]; if (!m) m = tally[col] = new Map();
            m.set(c, (m.get(c) || 0) + part);
          }
        };
        for (const it of items) {
          if (kind === "compute" && it[4] > 0) {
            // Visualize the profile-derived estimate; its position is not measured.
            const split = Math.min(it[1], it[0] + it[4]);
            paint(it[0], split, "recompute");
            paint(split, it[1], it[2]);
          } else {
            paint(it[0], it[1], kind === "compute" ? it[2] : it[3]);
          }
        }
        let runStart = -1, runCat = null;
        for (let col = 0; col <= width; col++) {
          let cat = null;
          const m = col < width ? tally[col] : null;
          if (m) { let best = 0; m.forEach((v, k) => { if (v > best) { best = v; cat = k; } }); }
          if (cat !== runCat) {
            if (runCat !== null) { ctx.fillStyle = color(runCat); ctx.fillRect(LEFT + runStart, y, col - runStart, BAR); }
            runStart = col; runCat = cat;
          }
        }
        // outline the bars wide enough to be seen as bars
        ctx.strokeStyle = "rgba(0,0,0,0.25)";
        for (const it of items) {
          if (it[1] < view.t0 || it[0] > view.t1) continue;
          const x0 = Math.max(LEFT, tToX(panel, it[0])), x1 = Math.min(W - RIGHT, tToX(panel, it[1]));
          if (x1 - x0 > 3) ctx.strokeRect(x0 + 0.5, y + 0.5, x1 - x0 - 1, BAR - 1);
        }
      });
      timeAxis(ctx, panel);
    };
    panel.hover = (x, y) => {
      const row = Math.floor((y - TOP) / LANE_H);
      if (row < 0 || row > 2 || x < LEFT) return null;
      const t = xToT(panel, x);
      const [kind, label, items] = lanes[row];
      const tol = (view.t1 - view.t0) / plotWidth(panel);
      let best = null;
      for (const it of items) { if (it[0] - tol <= t && t <= it[1] + tol) { best = it; if (it[0] <= t && t <= it[1]) break; } }
      if (!best) return null;
      if (kind === "compute") return best[3] + "\n" + best[2] + " task  " + fmtS(best[0]) + " → " + fmtS(best[1]) + "  (" + ((best[1] - best[0]) * 1e3).toFixed(2) + " ms)" + (best[4] == null ? "\nrecompute overhead unavailable: missing comparison profile" : best[4] > 0 ? "\nprofiled pair overhead: " + (best[4] * 1e3).toFixed(2) + " ms (estimate)" : "");
      const seconds = best[1] - best[0];
      if (best[6]) {
        const p = best[6];
        let detail = p.label + " · " + fmtDuration(seconds) + "\n" + p.timing
          + "\n" + (p.start_ns / 1e9).toFixed(9) + " → " + (p.end_ns / 1e9).toFixed(9) + " s";
        if (p.kind === "copy") {
          detail += "\nphysical host copy: " + preciseBytes(p.bytes)
            + (seconds > 0 ? " · " + (p.bytes / seconds / 1e9).toFixed(3) + " GB/s" : "");
        } else if (p.kind === "collective") {
          detail += "\ninput " + preciseBytes(p.input_bytes) + "\noutput " + preciseBytes(p.output_bytes)
            + "\ngroup " + p.group + " · " + p.group_size + " ranks · sequence " + p.group_sequence
            + "\npayload sizes, not fabric traffic; duration includes NCCL peer waits";
        } else {
          detail += "\nno bytes or bandwidth attributed to this interval";
        }
        return detail + "\n" + p.transfer_id + " · " + p.alias_group_id
          + "\nparent host payload " + preciseBytes(p.host_bytes)
          + "\nparent execution object " + preciseBytes(p.execution_bytes)
          + "\nwhole transfer " + fmtDuration((p.parent_end_ns - p.parent_start_ns) / 1e9);
      }
      return label + ": " + best[3] + "  full object " + fmtBytes(best[2]) + "\nhost copy " + fmtBytes(best[5] ?? best[2]) + "\n" + best[4] + "  " + fmtS(best[0]) + " → " + fmtS(best[1]) + "  (" + (seconds * 1e3).toFixed(2) + " ms" + (seconds > 0 ? ", " + (best[2] / seconds / 1e9).toFixed(1) + " effective GB/s" : "") + ")";
    };
  }

  // Collective events share the parent timeline's clock and are a breakdown,
  // never additional step time. Keep missing timing and capture loss visible.
  if (collectiveRecords.length) {
    const ledger = DATA.collectives;
    const records = collectiveRecords;
    const timed = records.filter((r) => r.started_at_ns != null && r.finished_at_ns != null);
    const operations = Array.from(new Set(timed.map((r) => r.operation)));
    const labels = {all_gather: "gather", reduce_scatter: "scatter", all_reduce: "reduce", all_to_all: "all-to-all"};
    const sourceColors = {fetch: "#00897b", evict: "#d81b60", task: "#7e57c2"};
    const rowHeight = 42, barHeight = 26;
    const status = ledger.complete ? "capture complete" : "capture incomplete";
    const panel = makePanel("Collectives inside transfers and tasks", timed.length + "/" + records.length + " timed · " + status + " · dropped " + (ledger.dropped || 0) + ", errors " + (ledger.errors || 0) + ", missing timing " + (ledger.missing_timings || 0), Math.max(1, operations.length) * rowHeight + TOP + BOTTOM);
    const note = document.createElement("p"); note.className = "meta";
    note.textContent = "These intervals are already included in the fetch, evict or compute bars above. Input/output bytes are per-rank tensor payloads, not fabric traffic. Collective durations include waiting for peers inside NCCL.";
    panel.root.append(note);
    Array.from(new Set(timed.map((r) => r.source))).forEach((source) => {
      const item = document.createElement("span"); item.style.setProperty("--c", sourceColors[source] || "#546e7a"); item.textContent = "inside " + source; panel.legend.append(item);
    });
    const rows = operations.map((op) => timed.filter((r) => r.operation === op));
    panel.draw = (ctx) => {
      rows.forEach((items, row) => {
        const y = TOP + row * rowHeight + (rowHeight - barHeight) / 2;
        ctx.textAlign = "right"; ctx.fillStyle = getComputedStyle(document.body).getPropertyValue("--muted");
        ctx.fillText(labels[operations[row]] || operations[row], LEFT - 8, y + barHeight / 2 + 4);
        for (const item of items) {
          const a = item.started_at_ns / 1e9, b = item.finished_at_ns / 1e9;
          if (b < view.t0 || a > view.t1) continue;
          const x0 = Math.max(LEFT, tToX(panel, a)), x1 = Math.min(panel.canvas.clientWidth - RIGHT, tToX(panel, b));
          ctx.fillStyle = sourceColors[item.source] || "#546e7a"; ctx.fillRect(x0, y, Math.max(0.6, x1 - x0), barHeight);
        }
      });
      timeAxis(ctx, panel);
    };
    panel.hover = (x, y) => {
      const row = Math.floor((y - TOP) / rowHeight);
      if (row < 0 || row >= rows.length || x < LEFT) return null;
      const t = xToT(panel, x), tol = (view.t1 - view.t0) / plotWidth(panel);
      const item = rows[row].find((r) => r.started_at_ns / 1e9 <= t && t <= r.finished_at_ns / 1e9)
        || rows[row].find((r) => r.started_at_ns / 1e9 - tol <= t && t <= r.finished_at_ns / 1e9 + tol);
      if (!item) return null;
      return item.operation + " inside " + item.source + "\ngroup " + item.group + " · " + item.group_size + " ranks · sequence " + item.group_sequence
        + "\n" + fmtS(item.started_at_ns / 1e9) + " → " + fmtS(item.finished_at_ns / 1e9) + " (" + ((item.finished_at_ns - item.started_at_ns) / 1e6).toFixed(3) + " ms)"
        + "\ninput " + preciseBytes(item.input_bytes) + "\noutput " + preciseBytes(item.output_bytes)
        + "\n" + (item.alias_group_id || item.execution_task_id || item.task_id || item.collective_id);
    };
  }

  if (showPhases) {
    const phases = DATA.transfer_phases;
    const root = document.createElement("div"); root.className = "panel";
    const title = document.createElement("h2"); title.textContent = "Host-copy and collective accounting"; root.append(title);
    const table = document.createElement("table");
    const header = document.createElement("tr");
    ["Operation / parent", "Count", "Host bytes", "Collective input", "Collective output", "Summed time", "Busy time", "Throughput GB/s"].forEach((label) => {
      const cell = document.createElement("th"); cell.textContent = label; header.append(cell);
    });
    table.append(header);
    for (const row of phases.summary) {
      const tr = document.createElement("tr");
      [row.label + " / " + row.source, row.count.toLocaleString(), row.copy_bytes == null ? "—" : fmtBytes(row.copy_bytes),
        row.input_bytes == null ? "—" : fmtBytes(row.input_bytes), row.output_bytes == null ? "—" : fmtBytes(row.output_bytes),
        fmtDuration(row.duration_sum_ns / 1e9), fmtDuration(row.busy_ns / 1e9),
        row.throughput_gbps == null ? "—" : row.throughput_gbps.toFixed(2)].forEach((value) => {
          const cell = document.createElement("td"); cell.textContent = value; tr.append(cell);
        });
      table.append(tr);
    }
    root.append(table);
    const note = document.createElement("p"); note.className = "meta";
    note.textContent = "Busy time is the union of intervals within each row; summed time adds their durations. Rows may overlap each other and computation. Collective input/output sizes are per-rank tensor payloads, not link traffic. Throughput is payload bytes / busy time: physical host bytes for copies, assembled output bytes for all-gather, full input bytes for reduce-scatter, and one tensor's bytes for all-reduce. Collective throughput is algorithmic, not physical link bandwidth. CUDA-event intervals include dispatch gaps between their markers. "
      + (phases.unresolved_copy_transfers.fetch + phases.unresolved_copy_transfers.evict
        ? "Host-copy timing unavailable for " + phases.unresolved_copy_transfers.fetch + " fetches (" + fmtBytes(phases.unresolved_host_bytes.fetch)
          + ") and " + phases.unresolved_copy_transfers.evict + " evictions (" + fmtBytes(phases.unresolved_host_bytes.evict) + "). Gray regions remain unsplit; they are not reported as memcpy time."
        : "Every host copy has its own interval.")
      + (phases.copy_capture ? " Transformed-copy capture " + (phases.copy_capture.complete ? "complete" : "incomplete")
        + "; dropped " + phases.copy_capture.dropped + ", errors " + phases.copy_capture.errors + ", missing timing " + phases.copy_capture.missing_timings + "."
        : " This capture predates separate host-copy events for transformed transfers.")
      + (phases.unmatched_records ? " " + phases.unmatched_records + " timed records could not be joined to a parent transfer." : "");
    root.append(note); document.getElementById("panels").append(root);
  }

  // --- the pools: stacked areas ------------------------------------------------
  (DATA.pools || []).forEach((pool) => {
    const names = Object.keys(pool.rows);
    const meta = "peak " + fmtGiB(pool.peak_gib) + " at " + fmtS(pool.peak_seconds)
      + (pool.reported_peak_gib != null ? " · planner " + fmtGiB(pool.reported_peak_gib) : "")
      + (pool.capacity_gib != null ? " · capacity " + fmtGiB(pool.capacity_gib) : "")
      + (pool.note ? " · " + pool.note : "");
    const panel = makePanel(pool.name + " pool over time", meta, 260);
    names.forEach((n) => { const s = document.createElement("span"); s.style.setProperty("--c", color(n)); s.textContent = n; panel.legend.append(s); });
    if (pool.capacity_gib != null) { const s = document.createElement("span"); s.className = "rule"; s.style.setProperty("--c", "#d33"); s.textContent = "capacity"; panel.legend.append(s); }
    const top = Math.max(pool.capacity_gib || 0, pool.peak_gib) * 1.06 || 1;
    const stacked = names.map(() => null);
    panel.draw = (ctx) => {
      const H = panel.height - BOTTOM, W = panel.canvas.clientWidth;
      const yOf = (v) => TOP + (H - TOP) * (1 - v / top);
      // grid
      ctx.strokeStyle = getComputedStyle(document.body).getPropertyValue("--line");
      ctx.fillStyle = getComputedStyle(document.body).getPropertyValue("--muted");
      const gstep = [1, 2, 5, 10, 20, 25, 50, 100].find((s) => top / s <= 6) || 200;
      for (let v = 0; v <= top; v += gstep) { const y = yOf(v); ctx.beginPath(); ctx.moveTo(LEFT, y + 0.5); ctx.lineTo(W - RIGHT, y + 0.5); ctx.stroke(); ctx.textAlign = "right"; ctx.fillText(fmtGiB(v), LEFT - 6, y + 4); }
      // visible sample range
      const times = pool.times;
      let i0 = 0; while (i0 < times.length - 1 && times[i0 + 1] < view.t0) i0++;
      let i1 = times.length - 1; while (i1 > 0 && times[i1 - 1] > view.t1) i1--;
      const base = new Float64Array(i1 - i0 + 1);
      names.forEach((n, k) => {
        const row = pool.rows[n];
        ctx.beginPath();
        for (let i = i0; i <= i1; i++) ctx.lineTo(tToX(panel, times[i]), yOf(base[i - i0]));
        for (let i = i1; i >= i0; i--) { base[i - i0] += row[i]; ctx.lineTo(tToX(panel, times[i]), yOf(base[i - i0])); }
        ctx.closePath(); ctx.fillStyle = color(n); ctx.fill();
      });
      if (pool.capacity_gib != null) { ctx.save(); ctx.setLineDash([6, 4]); ctx.strokeStyle = "#d33"; ctx.beginPath(); ctx.moveTo(LEFT, yOf(pool.capacity_gib) + 0.5); ctx.lineTo(W - RIGHT, yOf(pool.capacity_gib) + 0.5); ctx.stroke(); ctx.restore(); }
      // peak marker
      if (pool.peak_seconds >= view.t0 && pool.peak_seconds <= view.t1) { const x = tToX(panel, pool.peak_seconds); ctx.save(); ctx.setLineDash([2, 3]); ctx.strokeStyle = "#e6a100"; ctx.beginPath(); ctx.moveTo(x + 0.5, TOP); ctx.lineTo(x + 0.5, H); ctx.stroke(); ctx.restore(); }
      // clip the left gutter
      ctx.fillStyle = getComputedStyle(document.body).getPropertyValue("--panel"); ctx.fillRect(0, 0, LEFT - 1, H);
      for (let v = 0; v <= top; v += gstep) { const y = yOf(v); ctx.fillStyle = getComputedStyle(document.body).getPropertyValue("--muted"); ctx.textAlign = "right"; ctx.fillText(fmtGiB(v), LEFT - 6, y + 4); }
      timeAxis(ctx, panel);
    };
    panel.hover = (x, y) => {
      if (x < LEFT || x > panel.canvas.clientWidth - RIGHT) return null;
      const t = xToT(panel, x);
      let i = 0; while (i < pool.times.length - 1 && pool.times[i + 1] <= t) i++;
      let total = 0; const lines = [];
      names.forEach((n) => { const v = pool.rows[n][i]; total += v; if (v > 0.005) lines.push(n.padEnd(22) + fmtGiB(v).padStart(10)); });
      return fmtS(pool.times[i]) + "  total " + fmtGiB(total) + "\n" + lines.join("\n");
    };
  });

  function drawSelection(panel) {
    if (!panel.selection) return;
    const ctx = panel.canvas.getContext("2d");
    const [a, b] = panel.selection;
    ctx.fillStyle = "rgba(79, 111, 216, 0.18)"; ctx.fillRect(a, TOP, b - a, panel.height - BOTTOM - TOP);
    ctx.strokeStyle = "rgba(79, 111, 216, 0.9)"; ctx.strokeRect(a + 0.5, TOP + 0.5, b - a - 1, panel.height - BOTTOM - TOP - 1);
  }
  function redraw() { panels.forEach((p) => { p.draw(prepare(p)); drawSelection(p); }); }

  // --- the task view: every stage's alternatives, on a page of their own ----------
  // A step repeats its stages, so each distinct pair is drawn once, with how many
  // occurrences chose each alternative; the map above the cards says which.
  const ALTERNATIVES = DATA.alternatives;
  if (ALTERNATIVES && (ALTERNATIVES.forms.length || ALTERNATIVES.single.length)) {
    const root = document.getElementById("tasks"), timeline = document.getElementById("panels");
    const bar = document.getElementById("tabs"); bar.className = "tabs";
    const make = (tag, text, parent, className) => {
      const node = document.createElement(tag);
      if (text != null) node.textContent = text;
      if (className) node.className = className;
      if (parent) parent.append(node);
      return node;
    };
    const buttons = {};
    const show = (name) => {
      tab = name;
      timeline.hidden = name !== "timeline"; root.hidden = name !== "tasks";
      Object.entries(buttons).forEach(([key, button]) => button.setAttribute("aria-pressed", String(key === name)));
      history.replaceState(null, "", "#view-" + selected + (name === "tasks" ? "-tasks" : ""));
      if (name === "timeline") redraw();
    };
    [["timeline", "Timeline"], ["tasks", "Tasks"]].forEach(([key, label]) => {
      buttons[key] = make("button", label, bar);
      buttons[key].addEventListener("click", () => show(key));
    });
    const OPTION_COLORS = {save: PALETTE["saved activations"], recompute: PALETTE["recompute"]};
    const optionColor = (name) => OPTION_COLORS[name] || color("alternative " + name);
    const ms = (ns) => ns == null ? "—" : (ns / 1e6).toFixed(ns < 1e5 ? 3 : 2) + " ms";
    const size = (bytes) => bytes == null ? "—" : bytes === 0 ? "0" : fmtBytes(bytes);
    const traced = DATA.view === "traced";
    const span = (values, one, many) => {
      const sorted = Array.from(new Set(values)).sort((a, b) => a - b);
      if (!sorted.length) return "";
      const runs = [];
      sorted.forEach((value) => {
        const last = runs[runs.length - 1];
        if (last && value === last[1] + 1) last[1] = value; else runs.push([value, value]);
      });
      return (sorted.length === 1 ? one : many) + " " + runs.map(([a, b]) => a === b ? a : a + "–" + b).join(", ");
    };
    // Where each form occurs on the map: its stages and its microbatches.
    const where = ALTERNATIVES.forms.map(() => ({rows: [], columns: []}));
    if (ALTERNATIVES.map) ALTERNATIVES.map.rows.forEach((row) => row.cells.forEach((cell, index) => {
      if (!cell) return;
      where[cell[1]].rows.push(row.row); where[cell[1]].columns.push(ALTERNATIVES.map.columns[index]);
    }));
    const title = (form) => form.label || span(where[form.index].rows, "stage", "stages") || "alternative " + form.index;

    make("p", "Every stage of the step can run as one of its alternatives. Each distinct pair is shown once, with the number of occurrences that chose each; an identical layer or a repeated microbatch is an occurrence, not another card. Profiled time is what the planner priced."
      + (traced ? " Measured time is this step's median over the occurrences that ran; an alternative that was not chosen never ran." : "")
      + " Sizes are the device bytes a task's inputs, outputs and mutated objects reach; total is what they reach together plus the task's workspace.", root, "note");

    if (ALTERNATIVES.map) {
      const panel = make("div", null, root, "panel map");
      const head = make("div", null, panel, "head"); make("h2", "Which alternative each stage chose", head);
      make("span", ALTERNATIVES.map.rows.length + " stages · " + ALTERNATIVES.map.columns.length + " microbatches", head, "meta");
      const legend = make("div", null, panel, "legend");
      ALTERNATIVES.options.forEach((name) => { const item = make("span", name, legend); item.style.setProperty("--c", optionColor(name)); });
      const table = make("table", null, make("div", null, panel, "scroll"));
      const header = make("tr", null, table); make("th", "stage", header);
      ALTERNATIVES.map.columns.forEach((column) => make("th", "mb " + column, header));
      make("th", "form", header);
      // Consecutive stages that chose alike, with the same forms, share a line.
      const lines = [];
      ALTERNATIVES.map.rows.forEach((row) => {
        const key = JSON.stringify(row.cells), last = lines[lines.length - 1];
        if (last && last.key === key && row.row === last.rows[last.rows.length - 1] + 1) last.rows.push(row.row);
        else lines.push({key, rows: [row.row], cells: row.cells});
      });
      lines.forEach((line) => {
        const tr = make("tr", null, table);
        make("td", span(line.rows, "stage", "stages"), tr);
        line.cells.forEach((cell) => {
          const td = make("td", null, tr);
          if (!cell) { make("span", "·", td, "none"); return; }
          const link = make("a", null, td);
          link.href = "#form-" + cell[1]; link.title = (cell[0] || "no selection") + " · " + title(ALTERNATIVES.forms[cell[1]]);
          link.style.setProperty("--c", cell[0] ? optionColor(cell[0]) : "#bdbdbd");
          link.addEventListener("click", (event) => { event.preventDefault(); document.getElementById("form-" + cell[1]).scrollIntoView({behavior: "smooth", block: "start"}); });
        });
        const forms = Array.from(new Set(line.cells.filter(Boolean).map((cell) => cell[1])));
        make("td", forms.map((index) => title(ALTERNATIVES.forms[index])).filter((name, index, all) => all.indexOf(name) === index).join(" · "), tr);
      });
    }

    const columns = ["task", "profiled"].concat(traced ? ["measured"] : [], ["input", "output", "mutated", "workspace", "total"]);
    const cells = (row) => [row.phase, ms(row.runtime_ns)].concat(
      traced ? [row.measured ? ms(row.measured.median_ns) : "—"] : [],
      [size(row.input_bytes), size(row.output_bytes), size(row.mutated_bytes), size(row.workspace_bytes), size(row.total_bytes)]);
    const measuredTitle = (row) => row.measured
      ? row.measured.count + " occurrences · " + ms(row.measured.min_ns) + " to " + ms(row.measured.max_ns) : "";
    // Cards follow the step: by first stage, then first microbatch.
    const first = (values) => values.length ? Math.min(...values) : Infinity;
    ALTERNATIVES.forms.slice().sort((a, b) => first(where[a.index].rows) - first(where[b.index].rows)
      || first(where[a.index].columns) - first(where[b.index].columns) || a.index - b.index).forEach((form) => {
      const panel = make("div", null, root, "panel stage"); panel.id = "form-" + form.index;
      make("h3", title(form), panel);
      const place = [span(where[form.index].rows, "stage", "stages"), span(where[form.index].columns, "microbatch", "microbatches")].filter(Boolean).join(" × ");
      make("div", form.instances + (form.instances === 1 ? " occurrence" : " occurrences") + (place ? " · " + place : "")
        + " · chosen: " + form.options.map((option) => option.option + " " + option.chosen).join(" · ")
        + (form.sizes_vary ? " · sizes differ between occurrences; the first is shown" : ""), panel, "where");
      const pair = make("div", null, panel, "pair");
      form.options.forEach((option) => {
        const box = make("div", null, pair, "option" + (option.chosen ? " chosen" : ""));
        box.style.setProperty("--c", optionColor(option.option));
        const heading = make("h4", option.option, box);
        make("span", option.chosen === form.instances ? "selected" : option.chosen ? "selected by " + option.chosen + " of " + form.instances : "not selected", heading, "tag");
        const table = make("table", null, make("div", null, box, "scroll"));
        const header = make("tr", null, table); columns.forEach((name) => make("th", name, header));
        option.tasks.forEach((row) => {
          const tr = make("tr", null, table);
          cells(row).forEach((value, index) => { const td = make("td", value, tr); if (traced && index === 2) td.title = measuredTitle(row); });
          tr.title = row.label;
        });
        const sum = make("tr", null, table, "sum");
        const measured = option.tasks.every((row) => row.measured) ? option.tasks.reduce((total, row) => total + row.measured.median_ns, 0) : null;
        ["pair", ms(option.runtime_ns)].concat(traced ? [ms(measured)] : [], ["", "", "", "", ""]).forEach((value) => make("td", value, sum));
        make("div", option.retained_groups
          ? "holds " + fmtBytes(option.retained_bytes) + " in " + option.retained_groups + (option.retained_groups === 1 ? " object" : " objects") + " between its forward and its backward"
          : "holds nothing between its forward and its backward", box, "kept");
      });
    });

    if (ALTERNATIVES.single.length) {
      const panel = make("div", null, root, "panel");
      const details = make("details", null, panel);
      const count = ALTERNATIVES.single.reduce((total, row) => total + row.count, 0);
      make("summary", "Tasks without an alternative · " + count + " tasks in " + ALTERNATIVES.single.length + " forms", details);
      const table = make("table", null, make("div", null, details, "scroll"));
      const header = make("tr", null, table);
      ["task", "phase", "count"].concat(columns.slice(1)).forEach((name) => make("th", name, header));
      ALTERNATIVES.single.slice().sort((a, b) => (b.runtime_ns || 0) * b.count - (a.runtime_ns || 0) * a.count).forEach((row) => {
        const tr = make("tr", null, table);
        [row.label || "—", row.phase, row.count.toLocaleString()].concat(cells(row).slice(1)).forEach((value, index) => {
          const td = make("td", value, tr); if (traced && index === 4) td.title = measuredTitle(row);
        });
      });
    }
    show(tab);
  }

  window.addEventListener("resize", redraw);
  redraw();
})();
</script>
</body>
</html>
